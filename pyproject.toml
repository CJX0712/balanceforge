[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balanceforge"
version = "0.1.0"
description = "Geometry-routed rebalancing (MOSAIC) for imbalanced and long-tailed learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "晨星", email = "CJX0712@users.noreply.github.com" }]
keywords = [
    "imbalanced-learning",
    "long-tailed",
    "smote",
    "class-imbalance",
    "machine-learning",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "optuna>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
balanceforge = "balanceforge.cli:main"

[project.urls]
Homepage = "https://github.com/CJX0712/balanceforge"
Repository = "https://github.com/CJX0712/balanceforge"

[tool.setuptools.packages.find]
include = ["balanceforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -W ignore::UserWarning"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501: line length is enforced by the formatter, not the linter.
# B017: the tests deliberately assert that a broad exception class is raised,
#       because the samplers wrap several backend exception types.
# C408: the estimator-default tables read better as dict() literals with
#       trailing comments than as brace literals.
ignore = ["E501", "B008", "B017", "C408"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B017"]
"examples/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.coverage.run]
source = ["balanceforge"]
omit = ["*/__main__.py"]
